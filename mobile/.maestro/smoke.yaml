appId: com.maybesitter.app
name: MaybeSitter smoke
---
- launchApp:
    clearState: true

# ── Language, first (#469) ────────────────────────────────────────
# A fresh install asks for its language before anything else. 'العربية' is
# named in itself, so the tap reads the same whatever language the device is in.
- assertVisible:
    id: 'language-step'
- tapOn: 'العربية'
- tapOn:
    id: 'language-continue'
# The app is Arabic-first, so the Today tab reads «اليوم». A build that starts
# misconfigured shows the CFG-1 screen instead, and this assertion fails.
- assertVisible: 'اليوم'
- assertVisible: 'احكيها'
- tapOn: 'التقويم'
- assertVisible: 'الأسبوع'
- tapOn: 'اليوم'
