appId: com.maybesitter.app
name: MaybeSitter onboarding
---
# UC-2.R1 (#171): a signed-in user who has not been through onboarding cannot
# reach the product, and every consent starts off.
#
# Run this against a **development** build with EXPO_PUBLIC_DEV_BEARER_TOKEN
# set, so the app starts signed in and this flow is about onboarding rather
# than about sign-in. `.maestro/auth-gate.yaml` covers the other half.
#
# Maestro cannot type into a secure field, so nothing here signs in by hand.

- launchApp:
    clearState: true

# ── Language, first (#469) ────────────────────────────────────────
# A fresh install asks for its language before anything else. 'العربية' is
# named in itself, so the tap reads the same whatever language the device is in.
- assertVisible:
    id: 'language-step'
- tapOn: 'العربية'
- tapOn:
    id: 'language-continue'

# ── Welcome ────────────────────────────────────────────────────────
# Arabic is the default language.
- assertVisible: 'MaybeSitter بيمسك اللي بتقوله'
# And the product is not reachable behind it.
- assertNotVisible: 'احكيها'
- assertVisible: 'ما بينحفظ إشي قبل ما تأكّده.'
- tapOn: 'كمّل'

# ── Consent ────────────────────────────────────────────────────────
- assertVisible: 'شو بيقدر MaybeSitter يستخدم؟'
# Nothing is chosen: the screen says what it is waiting for.
- assertVisible: 'اختار وحدة من الجوابين فوق عشان تكمّل.'
# The AI card names what is sent, to whom, and what never is.
- assertVisible:
    text: 'لوين: Google Cloud Vertex AI .*'
- assertVisible:
    text: 'ما بينبعث أبداً: .*'

# Declining is an equal choice and says what still works.
- tapOn: 'مش هلّق (قواعد بس)'
- assertVisible: 'التقاط الالتزامات بيضل شغّال. بيقرا كلامك بالقواعد، وبيقلّك.'
# Changing your mind is allowed, both ways.
- tapOn: 'اسمح للذكاء الاصطناعي'
- assertNotVisible: 'اختار وحدة من الجوابين فوق عشان تكمّل.'

# The two switches start off; turn one on so the survey step is reached with a
# mixed set of answers rather than all-or-nothing.
- tapOn:
    id: 'اقترح خطوة وحدة جاية'
- tapOn: 'كمّل'

# ── Routine ────────────────────────────────────────────────────────
- assertVisible: 'كيف بيمشي يومك عادةً؟'
# The one notice that these answers leave the device.
- assertVisible:
    id: 'routine-sync-disclosure'
- tapOn: 'عادي — حوالي 23:30'
- tapOn: 'من 22:30'
- tapOn: 'كمّل'

# ── Guided setup (#469) ────────────────────────────────────────────
# AI was allowed above, so the setup opens on the life narrative: an
# invitation to talk, not a form. "Not now" is at the top end from the first
# frame. An inspiration prompt is not an answer, so the CTA waits for words.
- assertVisible:
    id: 'onboarding-setup'
- assertVisible: 'خلّيني أتعرف عليك شوي'
- assertVisible: 'مش هلق'
- assertNotVisible:
    id: 'setup-question-of'
- tapOn:
    id: 'setup-life-prompt-1'
- tapOn:
    id: 'setup-life-input'
- inputText: 'بدرس وبشتغل بالليل'
- hideKeyboard
- tapOn: 'خلّيك تعرفني أكثر'
- assertVisible: 'كيف بيمشي يومك العادي؟'
- tapOn: 'التالي'
- tapOn: 'التالي'
- tapOn: 'التالي'
- assertVisible: 'عادات بتحافظ عليها، أو بدك تحافظ عليها؟'
- tapOn: 'اقرا أجوبتي'
# The review: nothing is ticked, and saving nothing is a first-class answer.
- assertVisible: 'في إشي من هدول صح؟'
- tapOn: 'ما تحفظ إشي'

# ── Notifications, education only ──────────────────────────────────
- assertVisible: 'تذكيرات، وقت ما بدك ياها'
# No OS permission dialog appears here: the request belongs to S3 reminders.
- assertNotVisible: 'Allow'
- tapOn: 'يلا نبلّش'

# ── Today ──────────────────────────────────────────────────────────
- assertVisible: 'احكيها'

# And a relaunch goes straight there: onboarding is not shown twice.
- launchApp
- assertVisible: 'احكيها'
- assertNotVisible: 'MaybeSitter بيمسك اللي بتقوله'
