name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check repository invariants
        run: |
          npm run check:no-flutter
          npm run check:test-registration

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The infra and site scripts are how the cloud project and the public
      # site get created; a typo in them is a production problem.
      - name: shellcheck
        run: |
          shopt -s nullglob globstar
          files=(infra/**/*.sh site/*.sh scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"
            exit 0
          fi
          printf 'checking %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A separate job, not a step: it must not queue behind the full test suite.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --build-arg "GIT_SHA=${GITHUB_SHA}" -t maybesitter-api:ci .

      # The image must serve health without any cloud dependency, and must not
      # run as root.
      - name: Run it and probe health
        run: |
          docker run -d --name api -p 8080:8080 \
            -e MAYBESITTER_STORAGE_BACKEND=memory \
            maybesitter-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q "${GITHUB_SHA}" /tmp/health.json
          test "$(docker inspect --format '{{.Config.User}}' maybesitter-api:ci)" = node
          docker rm -f api

  durability-local:
    name: Durability (local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # UC-1.9 (#153): the read-only container check is the half of the durability
    # proof that needs no cloud project. It runs the real image with a read-only
    # root filesystem against the Firestore and Auth emulators, and fails if any
    # code path writes to local disk — which is how a store that quietly falls
    # back to the filesystem is caught before a deploy, not after.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the Firestore and Auth emulators
        run: |
          # The read-only container below reaches these through
          # host.docker.internal, so they have to accept connections from the
          # docker bridge. The emulators bind 127.0.0.1 by default: on Docker
          # Desktop that still works, because it proxies to host loopback, but
          # on a Linux runner the connection simply hangs until the storage
          # probe times out. Binding 0.0.0.0 is scoped to this generated config.
          node -e "const c=require('./firebase.json'),e=c.emulators||{};c.emulators={...e,firestore:{...e.firestore,host:'0.0.0.0',port:8080},auth:{...e.auth,host:'0.0.0.0',port:9099},ui:{enabled:false}};require('fs').writeFileSync('.firebase-ci.json',JSON.stringify(c,null,2))"
          npx --yes firebase-tools@14 emulators:start --only firestore,auth \
            --project demo-maybesitter --config .firebase-ci.json >/tmp/emulators.log 2>&1 &
          for _ in $(seq 1 60); do
            if nc -z 127.0.0.1 8080 && nc -z 127.0.0.1 9099; then exit 0; fi
            sleep 1
          done
          echo "emulators never came up"; tail -20 /tmp/emulators.log; exit 1

      # `npm test` uses the memory adapter, which stores whatever JSON accepts.
      # Firestore does not, and the emulator suite that would say so ran in no
      # workflow at all — so #252's fix shipped a nested array, CI stayed green,
      # and capture answered 400 on the first real request in staging. These
      # attach to the emulators started above rather than nesting another pair.
      - name: The emulator suite, against real Firestore and Auth
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          GCLOUD_PROJECT: demo-maybesitter
        run: npm run test:emulator:attach

      # Fails on EROFS in the logs, on a service that never reports ready, or on
      # any `docker diff` entry outside /tmp.
      - name: The image serves with a read-only root filesystem
        run: scripts/verify-readonly-container.sh

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      # A staging or production configuration without a real https backend URL
      # must fail while Expo reads the project (CFG-1), not on a tester's phone.
      - name: Release config guard
        run: |
          if APP_ENV=production npx expo config --type public >/dev/null 2>&1; then
            echo "expected CFG-1 failure with no API URL"; exit 1
          fi
          APP_ENV=production EXPO_PUBLIC_API_BASE_URL=https://api.example.com \
            npx expo config --type public >/dev/null

      # Signing material in the repository is not something a review catches
      # reliably, and rotating a leaked upload key means a new app listing
      # (UC-1.6a #150).
      - name: No credentials in the repository
        run: npm run check:no-credentials

      # Apple does not reliably read privacy manifests out of static CocoaPods,
      # and this app uses static frameworks because RN Firebase needs them. So a
      # dependency that brings a new required-reason API has to be declared in
      # the app's own manifest — and if it is not, nothing fails until an
      # ITMS-91053 email arrives an hour after the upload (UC-4.3a #178).
      - name: Privacy manifests cover what the dependencies use
        run: npm run check:privacy-manifests
