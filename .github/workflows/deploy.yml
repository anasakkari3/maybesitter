# Production only. It is dispatched by hand and waits for the owner's approval
# on its protected environment.
#
# Staging no longer deploys from here. It used to deploy on every push to main
# with the same deployer identity production uses, which holds project-level
# run.admin, datastore.indexAdmin and firebaserules.admin in maybesitter-app,
# so a staging run could change production (Phase 5.7/5.8). Staging now has its
# own project and identities: deploy-staging.yml and infra-staging.yml. The old
# shared-project staging service (maybesitter-api-staging in maybesitter-app)
# is legacy and is no longer deployed by any workflow.
#
# Order inside the job, and why: the Firestore indexes of this environment's
# database are deployed and reported READY before a new revision exists, and
# the revision is staged behind a tag until its smoke test passes. Live traffic
# moves last. Index builds take time, so the gate waits; it does not assume a
# deploy is finished when the CLI returns. This workflow deploys only
# production's database (firebase.production.json): firebase.json lists both
# databases of maybesitter-app, and deploying it would also change the legacy
# staging one.
#
# Real runs found the three first-deploy failures pinned in
# tests/infra/firstDeploy.test.ts.
#
# Promotion still reads the legacy staging service: production deploys only a
# digest that maybesitter-api-staging in maybesitter-app is serving (see the
# resolve step). That check is unchanged on purpose, so this commit does not
# change what production may deploy. Until promotion is re-pointed at the
# isolated staging project, a new commit cannot reach production through this
# workflow; that is an owner decision, recorded in docs/operations/DEPLOY.md.

name: Deploy

on:
  # Manual only. The `target` input stays so existing dispatch commands
  # (`-f target=production`) keep working; production is its only option.
  workflow_dispatch:
    inputs:
      target:
        description: Which environment to deploy (production only; staging is deploy-staging.yml)
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: maybesitter-app
  REGION: europe-west1
  REPOSITORY: maybesitter
  IMAGE: api

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # `production` is a protected GitHub environment: the owner is a required
    # reviewer, so a production deploy waits for an explicit approval.
    environment: production
    # Fixed, not read from the input: every step reads TARGET, and nothing
    # further down may infer which service to touch from an input value.
    env:
      TARGET: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keyless: no service-account JSON key exists anywhere. The pool is
      # pinned to this repository on refs/heads/main by infra/bootstrap.sh.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Resolve the staging image for production (same-digest promotion)
        id: resolve
        if: env.TARGET == 'production'
        run: |
          # Production never builds its own image. A rebuild from the same
          # commit is not guaranteed to produce the same digest — Docker layer
          # timestamps and base-image resolution are not pinned bit-for-bit —
          # so "rebuild on promote" could silently deploy bytes staging never
          # ran or smoke-tested. Production instead resolves the digest the
          # staging deploy of this exact commit already pushed, and deploys
          # that digest unchanged.
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          if ! DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}" --format='value(image_summary.digest)' 2>&1)"; then
            echo "::error::no image was pushed for ${GITHUB_SHA} (${IMAGE_URI}). Deploy staging for this commit first."
            exit 1
          fi
          IMAGE_DIGEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}@${DIGEST}"

          # And staging must actually be *running* it, not merely have pushed
          # it once: a staging deploy that failed its own smoke test, or was
          # superseded by a later push before this dispatch ran, must not let
          # production promote unverified bytes.
          STAGING_REVISION="$(gcloud run services describe maybesitter-api-staging --region "${REGION}" --format=json \
            | jq -r '.status.traffic[]? | select(.percent == 100) | .revisionName')"
          if [ -z "${STAGING_REVISION}" ]; then
            echo "::error::staging has no revision serving 100% traffic. Deploy staging for this commit first."
            exit 1
          fi
          STAGING_IMAGE="$(gcloud run revisions describe "${STAGING_REVISION}" --region "${REGION}" --format='value(spec.containers[0].image)')"
          if [ "${STAGING_IMAGE}" != "${IMAGE_DIGEST}" ]; then
            echo "::error::staging is serving ${STAGING_IMAGE}, not ${IMAGE_DIGEST}. Deploy staging for this commit first."
            exit 1
          fi

          echo "image_digest=${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Protect the production image from registry cleanup
        if: env.TARGET == 'production'
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          # infra/artifact-cleanup.json deletes any version older than 30 days
          # outside the newest 10, and staging pushes a version on every merge,
          # so the digest production runs would soon become deletable. Its Keep
          # rule spares versions tagged `prod-*`. The tag goes on before any
          # production revision references the digest, so there is no window
          # in which production runs an unprotected image.
          #
          # Re-runs must work: a smoke-test flake or a Firestore-step failure is
          # retried for the same commit. `gcloud artifacts docker tags add` on
          # an existing tag deletes and recreates it, which needs
          # artifactregistry.tags.delete, and the deployer's writer role does not
          # have it. So the tag is only added when absent; when it already names
          # this digest there is nothing to do; when it names another digest the
          # run stops rather than silently moving a production marker.
          TAG_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:prod-${GITHUB_SHA}"
          WANT="${IMAGE_DIGEST#*@}"
          if CURRENT="$(gcloud artifacts docker images describe "${TAG_URI}" --format='value(image_summary.digest)' 2>/dev/null)" && [ -n "${CURRENT}" ]; then
            if [ "${CURRENT}" = "${WANT}" ]; then
              echo "${TAG_URI} already protects ${WANT}; nothing to do"
            else
              echo "::error::${TAG_URI} already points at ${CURRENT}, not the digest being promoted (${WANT}). Staging re-pushed this commit after an earlier production run tagged it. Refusing to move a production tag: someone with roles/artifactregistry.repoAdmin must check which digest production runs, then move or delete the tag, and re-run."
              exit 1
            fi
          else
            gcloud artifacts docker tags add "${IMAGE_DIGEST}" "${TAG_URI}"
          fi

      - name: Validate and deploy Firestore rules and indexes (this environment's database only)
        id: firestore
        run: |
          # --non-interactive: no one to answer a prompt in CI. NOT --force: that
          # would delete field overrides the project has and this file does not
          # list, which is how the TTL policies from infra/firestore-ttl.sh would
          # silently disappear. The per-environment config names one database.
          case "${TARGET}" in
            production) DATABASE="(default)"; FIREBASE_CONFIG="firebase.production.json" ;;
            *) echo "refusing to deploy: unknown target '${TARGET}'"; exit 1 ;;
          esac
          echo "database=${DATABASE}" >>"${GITHUB_OUTPUT}"
          node scripts/firestore-index-ready.mjs validate firestore.indexes.json
          npx --yes firebase-tools@14 deploy --only firestore --config "${FIREBASE_CONFIG}" --non-interactive --project "${PROJECT_ID}"

      - name: Wait until the new indexes are READY
        # Accepted is not built: a query that needs a CREATING index fails until
        # the build finishes, so no revision that uses them may take traffic first.
        env:
          DATABASE: ${{ steps.firestore.outputs.database }}
        timeout-minutes: 60
        run: node scripts/firestore-index-ready.mjs wait "${DATABASE}" 55

      - name: Deploy (behind a tag once the service exists)
        id: deploy
        run: |
          # Explicit, and refused when unknown. The previous form selected the
          # production service whenever the target was not exactly "staging" —
          # including when it was empty, which is precisely what a push trigger
          # produces. A deploy workflow must not reach production by falling
          # through a test.
          case "${TARGET}" in
            production) SERVICE="maybesitter-api" ;;
            *) echo "refusing to deploy: unknown target '${TARGET}'"; exit 1 ;;
          esac
          echo "service=${SERVICE}" >>"${GITHUB_OUTPUT}"
          # Cloud Run rejects --no-traffic when it is creating a service, so the
          # very first deploy of each service takes traffic at once. It is still
          # gated: Cloud Run will not route to a revision that fails its startup
          # probe (/api/health/ready), and the smoke test below runs before this
          # job can report success. Every later deploy is staged behind a tag.
          TRAFFIC_FLAGS=()
          if gcloud run services describe "${SERVICE}" --region "${REGION}" >/dev/null 2>&1; then
            TRAFFIC_FLAGS=(--no-traffic --tag "sha-${GITHUB_SHA::7}")
          fi
          # The image is deployed by digest, so production runs the exact bytes
          # staging ran: `resolve` set it. (This used to read
          # `steps.build… || steps.resolve…`; `build` ran only for staging, so
          # on a production run the value was always the resolved digest.)
          # flags.sh runs as its own assignment: under `bash -e` a failing
          # $(...) inside another command's arguments does not stop the step,
          # so a refused pepper-rotation.env (#798) would deploy with no flags
          # and the revision would inherit the old settings. It prints one
          # flag per word, so splitting on whitespace is exact.
          FLAGS="$(bash infra/cloudrun/flags.sh "${TARGET}")"
          read -ra FLAG_WORDS <<<"${FLAGS}"
          gcloud run deploy "${SERVICE}" \
            --image "${{ steps.resolve.outputs.image_digest }}" \
            --region "${REGION}" \
            ${TRAFFIC_FLAGS[@]+"${TRAFFIC_FLAGS[@]}"} \
            "${FLAG_WORDS[@]}"

      - name: Smoke test the new revision
        run: |
          gcloud run services describe "${{ steps.deploy.outputs.service }}" \
            --region "${REGION}" --format=json >/tmp/service.json
          URL="$(jq -r '.status.url // empty' /tmp/service.json)"
          # The revision this run staged behind a tag. The first deploy of a
          # service has no tag, so this is empty and the probe goes to the
          # service URL instead. (A gcloud `filter()` projection was used here
          # before; it is not valid gcloud syntax and failed the first real run.)
          TAG_URL="$(jq -r --arg tag "sha-${GITHUB_SHA::7}" \
            '.status.traffic[]? | select(.tag == $tag) | .url // empty' /tmp/service.json)"
          PROBE="${TAG_URL:-$URL}"
          [ -n "${PROBE}" ] || { echo "could not resolve a URL for the service"; exit 1; }
          for _ in $(seq 1 30); do
            body="$(curl -fsS "${PROBE}/api/health/ready" || true)"
            case "${body}" in *'"ready":true'*) break ;; esac
            sleep 5
          done
          curl -fsS "${PROBE}/api/health" | tee /tmp/health.json
          grep -q "${GITHUB_SHA}" /tmp/health.json

      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic "${{ steps.deploy.outputs.service }}" \
            --region "${REGION}" --to-latest
